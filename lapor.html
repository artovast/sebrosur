<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D9E75">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#1D9E75">
  <meta name="apple-mobile-web-app-title" content="SeBrosur">
  <link rel="manifest" href="manifest.json">
  <title>Lapor Distribusi — SeBrosur</title>
  <style>
    :root {
      --hijau: #1D9E75;
      --hijau-gelap: #0F6E56;
      --hijau-muda: #E1F5EE;
      --teks: #1a1a1a;
      --abu: #666;
      --redup: #aaa;
      --border: #eee;
      --bg: #f2f2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0;
        -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--teks);
      font-size: 16px; overflow-x: hidden;
    }

    /* TOPBAR */
    .topbar {
      background: var(--hijau);
      padding: 18px;
      padding-top: max(18px, env(safe-area-inset-top));
      display: flex; align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 22px; font-weight: 800; color: #fff; }
    .topbar-sub { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 2px; }

    /* STATE */
    .state-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 75vh; padding: 40px 24px;
      text-align: center; gap: 16px;
    }
    .state-icon { font-size: 72px; }
    .state-title { font-size: 22px; font-weight: 700; }
    .state-sub { font-size: 16px; color: var(--abu); line-height: 1.6; }

    /* INFO CARD */
    .info-card {
      background: var(--hijau-muda);
      margin: 16px; border-radius: 16px;
      padding: 20px;
    }
    .info-label { font-size: 13px; color: var(--hijau-gelap); margin-bottom: 4px; }
    .info-value { font-size: 17px; font-weight: 700; color: var(--hijau-gelap); }
    .info-row { display: flex; gap: 16px; margin-top: 14px; }
    .info-item { flex: 1; }
    .info-item .info-value { font-size: 15px; font-weight: 600; }

    /* INSTRUKSI */
    .instruksi {
      margin: 0 16px 8px; padding: 14px 16px;
      background: #fff; border-radius: 12px;
      font-size: 14px; color: var(--abu); line-height: 1.5;
      border-left: 4px solid var(--hijau);
    }

    /* FORM */
    .form-wrap {
      padding: 16px; display: flex;
      flex-direction: column; gap: 16px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .form-title {
      font-size: 18px; font-weight: 700; color: var(--teks);
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-label { font-size: 14px; font-weight: 500; color: var(--teks); }
    .input-hint { font-size: 12px; color: var(--redup); }
    .input {
      height: 52px; border-radius: 12px;
      border: 2px solid var(--border); padding: 0 16px;
      font-size: 16px; color: var(--teks);
      background: #fff; width: 100%;
      transition: border-color .15s;
    }
    .input:focus { outline: none; border-color: var(--hijau); }
    .textarea {
      min-height: 100px; border-radius: 12px;
      border: 2px solid var(--border); padding: 14px 16px;
      font-size: 16px; color: var(--teks);
      background: #fff; width: 100%;
      font-family: inherit; resize: vertical;
      transition: border-color .15s;
    }
    .textarea:focus { outline: none; border-color: var(--hijau); }
    .btn-submit {
      height: 56px; border-radius: 14px;
      background: var(--hijau); color: #fff;
      font-size: 17px; font-weight: 700;
      border: none; cursor: pointer; width: 100%;
      transition: all .15s; margin-top: 4px;
    }
    .btn-submit:active { background: var(--hijau-gelap); transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 90px; left: 18px; right: 18px;
      background: rgba(26,26,26,.93); color: #fff;
      padding: 16px 20px; border-radius: 16px;
      font-size: 16px; opacity: 0; transition: opacity .3s;
      pointer-events: none; text-align: center; line-height: 1.4;
    }
    .toast.show { opacity: 1; }

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%{background-position:200% 0} 100%{background-position:-200% 0}
    }
    .sk-wrap { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .sk-card {
      background: #fff; border-radius: 16px;
      padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <div class="brand">SeBrosur</div>
      <div class="topbar-sub">Lapor Distribusi</div>
    </div>
  </div>
  <!-- Skeleton loading -->
  <div class="sk-wrap">
    <div class="sk-card">
      <div class="skeleton" style="height:14px;width:40%"></div>
      <div class="skeleton" style="height:20px;width:70%"></div>
      <div style="display:flex;gap:16px;margin-top:4px">
        <div style="flex:1"><div class="skeleton" style="height:14px;width:80%"></div></div>
        <div style="flex:1"><div class="skeleton" style="height:14px;width:80%"></div></div>
      </div>
    </div>
    <div class="skeleton" style="height:48px;margin:0 0 4px"></div>
    <div class="sk-card">
      <div class="skeleton" style="height:18px;width:50%"></div>
      <div class="skeleton" style="height:52px"></div>
      <div class="skeleton" style="height:52px"></div>
      <div class="skeleton" style="height:90px"></div>
      <div class="skeleton" style="height:52px"></div>
      <div class="skeleton" style="height:56px;border-radius:14px"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziu8op-d3lrOosgoURgo3mwR8Zz2QDjLI4da9BJQ4JtMfBOuJUbVzk-gtsUieKXdsJ/exec';

  var REF_CODE = new URLSearchParams(window.location.search).get('ref') || '';
  var INFO     = null;

  // =============================================
  // INIT
  // =============================================
  if (!REF_CODE) {
    showErrorScreen('Link tidak valid. Pastikan kamu mengakses dari link referral yang benar.');
  } else {
    fetchPost({ action: 'getBrosurInfo', ref: REF_CODE })
      .then(onInfoLoaded)
      .catch(function() {
        showErrorScreen('Gagal terhubung ke server. Coba lagi nanti.');
      });
  }

  // =============================================
  // CALLBACKS
  // =============================================
  function onInfoLoaded(data) {
    if (data.error) {
      showErrorScreen(data.error);
      return;
    }
    INFO = data;
    renderForm();
  }

  // =============================================
  // RENDER FORM
  // =============================================
  function renderForm() {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div>' +
          '<div class="brand">SeBrosur</div>' +
          '<div class="topbar-sub">Lapor Distribusi</div>' +
        '</div>' +
      '</div>' +

      '<div class="info-card">' +
        '<div class="info-label">Brosur yang disebar</div>' +
        '<div class="info-value">' + esc(INFO.namaBrosur) + '</div>' +
        '<div class="info-row">' +
          '<div class="info-item">' +
            '<div class="info-label">Driver</div>' +
            '<div class="info-value">' + esc(INFO.namaDriver) + '</div>' +
          '</div>' +
          '<div class="info-item">' +
            '<div class="info-label">Kode</div>' +
            '<div class="info-value">' + esc(REF_CODE) + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="instruksi">' +
        '💡 Laporkan setiap brosur yang berhasil kamu berikan ke penumpang. ' +
        'Fee distribusi Rp1.000 per laporan valid.' +
      '</div>' +

      '<div class="form-wrap">' +
        '<div class="form-title">Detail laporan</div>' +

        '<div class="input-group">' +
          '<div class="input-label">Nama penumpang</div>' +
          '<div class="input-hint">Opsional — jika diketahui</div>' +
          '<input class="input" id="inp-nama" type="text" placeholder="contoh: Pak Budi" autocomplete="off">' +
        '</div>' +

        '<div class="input-group">' +
          '<div class="input-label">Nomor HP penumpang</div>' +
          '<div class="input-hint">Opsional — jika penumpang bersedia</div>' +
          '<input class="input" id="inp-hp" type="tel" placeholder="contoh: 08123456789">' +
        '</div>' +

        '<div class="input-group">' +
          '<div class="input-label">Situasi / konteks saat disebar</div>' +
          '<textarea class="textarea" id="inp-situasi" ' +
            'placeholder="contoh: penumpang tanya soal asuransi, cocok dengan brosur ini"></textarea>' +
        '</div>' +

        '<div class="input-group">' +
          '<div class="input-label">Lokasi titik antar</div>' +
          '<input class="input" id="inp-lokasi" type="text" ' +
            'placeholder="contoh: Mal Taman Anggrek, Jakarta Barat">' +
        '</div>' +

        '<button class="btn-submit" id="btn-submit" onclick="submitLaporan()">Kirim Laporan</button>' +
      '</div>';
  }

  // =============================================
  // SUBMIT
  // =============================================
  function submitLaporan() {
    var btn = document.getElementById('btn-submit');
    btn.textContent = 'Mengirim...';
    btn.disabled    = true;

    var payload = {
      action:     'laporDistribusi',
      ref:        REF_CODE,
      namaProspek: document.getElementById('inp-nama').value.trim(),
      hpProspek:   document.getElementById('inp-hp').value.trim(),
      situasi:     document.getElementById('inp-situasi').value.trim(),
      lokasi:      document.getElementById('inp-lokasi').value.trim()
    };

    fetchPost(payload)
      .then(function(data) {
        if (data.error) {
          showToast('Gagal: ' + data.error);
          btn.textContent = 'Kirim Laporan';
          btn.disabled    = false;
          return;
        }
        showSuccessScreen();
      })
      .catch(function() {
        showToast('Terjadi kesalahan, coba lagi.');
        btn.textContent = 'Kirim Laporan';
        btn.disabled    = false;
      });
  }

  // =============================================
  // STATE SCREENS
  // =============================================
  function showSuccessScreen() {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div>' +
          '<div class="brand">SeBrosur</div>' +
          '<div class="topbar-sub">Lapor Distribusi</div>' +
        '</div>' +
      '</div>' +
      '<div class="state-screen">' +
        '<div class="state-icon">✅</div>' +
        '<div class="state-title">Laporan terkirim!</div>' +
        '<div class="state-sub">' +
          'Fee distribusi akan dikreditkan setelah verifikasi.<br>' +
          'Kamu perlu minimal <strong>20 laporan valid</strong> untuk cairkan.' +
        '</div>' +
        '<button class="btn-submit" style="max-width:280px;margin-top:12px" ' +
          'onclick="renderForm()">Laporkan lagi</button>' +
      '</div>';
  }

  function showErrorScreen(msg) {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div>' +
          '<div class="brand">SeBrosur</div>' +
          '<div class="topbar-sub">Lapor Distribusi</div>' +
        '</div>' +
      '</div>' +
      '<div class="state-screen">' +
        '<div class="state-icon">🚫</div>' +
        '<div class="state-title">Tidak dapat diakses</div>' +
        '<div class="state-sub">' + esc(msg) + '</div>' +
      '</div>';
  }

  // =============================================
  // UTILS
  // =============================================
  function fetchPost(data) {
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'text/plain' }
    }).then(function(r) { return r.json(); });
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3500);
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // SERVICE WORKER
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sebrosur/serviceworker.js')
        .then(function(r) { console.log('SW lapor:', r.scope); })
        .catch(function(e) { console.log('SW error:', e); });
    });
  }
</script>
</body>
</html>
