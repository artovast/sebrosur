<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D9E75">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#1D9E75">
  <meta name="apple-mobile-web-app-title" content="SeBrosur">
  <link rel="manifest" href="manifest.json">
  <title>SeBrosur</title>
  <style>
    :root {
      --hijau: #1D9E75;
      --hijau-gelap: #0F6E56;
      --hijau-muda: #E1F5EE;
      --teks: #1a1a1a;
      --abu: #666;
      --redup: #aaa;
      --border: #eee;
      --bg: #f2f2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0;
        -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--teks);
      font-size: 16px; overflow-x: hidden;
    }

    /* TOPBAR */
    .topbar {
      background: var(--hijau);
      padding: 18px;
      padding-top: max(18px, env(safe-area-inset-top));
      display: flex; align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 22px; font-weight: 800; color: #fff; }
    .topbar-sub { font-size: 13px; color: rgba(255,255,255,.75); margin-top: 2px; }

    /* STATE */
    .state-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 75vh; padding: 40px 24px;
      text-align: center; gap: 16px;
    }
    .state-icon { font-size: 72px; }
    .state-title { font-size: 22px; font-weight: 700; }
    .state-sub { font-size: 16px; color: var(--abu); line-height: 1.6; }

    /* BROSUR HEADER */
    .brosur-header {
      padding: 24px 18px 16px;
    }
    .brosur-kategori {
      display: inline-block; font-size: 12px; font-weight: 700;
      padding: 5px 12px; border-radius: 10px;
      background: var(--hijau-muda); color: var(--hijau-gelap);
      margin-bottom: 10px;
    }
    .brosur-nama {
      font-size: 24px; font-weight: 800;
      color: var(--teks); line-height: 1.3; margin-bottom: 8px;
    }
    .brosur-advertiser {
      font-size: 15px; color: var(--abu);
    }
    .brosur-advertiser strong { color: var(--teks); font-weight: 600; }

    /* DESKRIPSI */
    .brosur-desc {
      padding: 0 18px 20px;
      font-size: 16px; color: var(--abu);
      line-height: 1.7;
    }

    /* DIVIDER */
    .divider {
      height: 8px; background: var(--border);
    }

    /* SECTION TERTARIK */
    .section-cta {
      padding: 24px 18px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
    }
    .section-cta-title {
      font-size: 20px; font-weight: 700; color: var(--teks);
      margin-bottom: 6px;
    }
    .section-cta-sub {
      font-size: 15px; color: var(--abu); line-height: 1.5;
      margin-bottom: 20px;
    }

    /* FORM LEAD */
    .form-lead {
      display: flex; flex-direction: column; gap: 14px;
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-label { font-size: 14px; font-weight: 500; color: var(--teks); }
    .input-required { color: #E24B4A; }
    .input {
      height: 52px; border-radius: 12px;
      border: 2px solid var(--border); padding: 0 16px;
      font-size: 16px; color: var(--teks);
      background: #fff; width: 100%;
      transition: border-color .15s;
    }
    .input:focus { outline: none; border-color: var(--hijau); }
    .textarea {
      min-height: 90px; border-radius: 12px;
      border: 2px solid var(--border); padding: 14px 16px;
      font-size: 16px; color: var(--teks);
      background: #fff; width: 100%;
      font-family: inherit; resize: vertical;
      transition: border-color .15s;
    }
    .textarea:focus { outline: none; border-color: var(--hijau); }
    .btn-submit {
      height: 56px; border-radius: 14px;
      background: var(--hijau); color: #fff;
      font-size: 17px; font-weight: 700;
      border: none; cursor: pointer; width: 100%;
      transition: all .15s; margin-top: 4px;
    }
    .btn-submit:active { background: var(--hijau-gelap); transform: scale(.98); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }
    .form-error {
      font-size: 14px; color: #E24B4A;
      background: #FCEBEB; padding: 12px 16px;
      border-radius: 10px; display: none;
    }
    .form-error.show { display: block; }

    /* VOUCHER */
    .voucher-wrap {
      display: flex; flex-direction: column; gap: 16px;
      align-items: center;
    }
    .btn-voucher {
      height: 56px; border-radius: 14px;
      background: var(--hijau); color: #fff;
      font-size: 17px; font-weight: 700;
      border: none; cursor: pointer; width: 100%;
      transition: all .15s;
    }
    .btn-voucher:active { background: var(--hijau-gelap); transform: scale(.98); }
    .voucher-box {
      background: #fff; border: 2px dashed var(--hijau);
      border-radius: 14px; padding: 20px;
      text-align: center; width: 100%;
    }
    .voucher-label { font-size: 13px; color: var(--abu); margin-bottom: 8px; }
    .voucher-code {
      font-size: 28px; font-weight: 800; color: var(--hijau-gelap);
      letter-spacing: 2px; word-break: break-all;
    }
    .voucher-instruksi {
      margin-top: 14px; font-size: 14px; color: var(--abu);
      line-height: 1.5; text-align: left;
      padding: 14px 16px; background: var(--hijau-muda);
      border-radius: 10px;
    }

    /* FOOTER */
    .page-footer {
      padding: 20px 18px 16px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      text-align: center; font-size: 13px; color: var(--redup);
      border-top: 1px solid var(--border);
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 90px; left: 18px; right: 18px;
      background: rgba(26,26,26,.93); color: #fff;
      padding: 16px 20px; border-radius: 16px;
      font-size: 16px; opacity: 0; transition: opacity .3s;
      pointer-events: none; text-align: center; line-height: 1.4;
    }
    .toast.show { opacity: 1; }

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%{background-position:200% 0} 100%{background-position:-200% 0}
    }
    .sk-wrap { padding: 24px 18px; display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>

<div id="app">
  <div class="topbar">
    <div>
      <div class="brand">SeBrosur</div>
    </div>
  </div>
  <!-- Skeleton loading -->
  <div class="sk-wrap">
    <div class="skeleton" style="height:14px;width:25%;border-radius:10px"></div>
    <div class="skeleton" style="height:28px;width:80%"></div>
    <div class="skeleton" style="height:16px;width:50%"></div>
    <div style="height:10px"></div>
    <div class="skeleton" style="height:16px;width:100%"></div>
    <div class="skeleton" style="height:16px;width:90%"></div>
    <div class="skeleton" style="height:16px;width:75%"></div>
    <div style="height:16px"></div>
    <div class="skeleton" style="height:8px;width:100%;border-radius:0"></div>
    <div style="height:8px"></div>
    <div class="skeleton" style="height:22px;width:40%"></div>
    <div class="skeleton" style="height:16px;width:65%"></div>
    <div class="skeleton" style="height:52px"></div>
    <div class="skeleton" style="height:52px"></div>
    <div class="skeleton" style="height:56px;border-radius:14px"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziu8op-d3lrOosgoURgo3mwR8Zz2QDjLI4da9BJQ4JtMfBOuJUbVzk-gtsUieKXdsJ/exec';

  var REF_CODE = new URLSearchParams(window.location.search).get('ref') || '';
  var BROSUR   = null;

  // =============================================
  // INIT
  // =============================================
  if (!REF_CODE) {
    showErrorScreen('Link tidak valid. Pastikan kamu mendapat link dari driver.');
  } else {
    fetchPost({ action: 'getBrosurProspek', ref: REF_CODE })
      .then(onDataLoaded)
      .catch(function() {
        showErrorScreen('Gagal terhubung ke server. Coba lagi nanti.');
      });
  }

  // =============================================
  // CALLBACKS
  // =============================================
  function onDataLoaded(data) {
    if (data.error) {
      showErrorScreen(data.error);
      return;
    }
    if (data.suspended) {
      showSuspendedScreen();
      return;
    }
    BROSUR = data;
    renderBrosur();
  }

  // =============================================
  // RENDER BROSUR PAGE
  // =============================================
  function renderBrosur() {
    var ctaHtml = '';

    if (BROSUR.ada_lead) {
      ctaHtml =
        '<div class="section-cta-title">Tertarik?</div>' +
        '<div class="section-cta-sub">Isi data di bawah, tim kami akan segera menghubungi kamu.</div>' +
        '<div class="form-error" id="form-error"></div>' +
        '<div class="form-lead">' +
          '<div class="input-group">' +
            '<div class="input-label">Nama lengkap <span class="input-required">*</span></div>' +
            '<input class="input" id="inp-nama" type="text" placeholder="Nama lengkap kamu" autocomplete="name">' +
          '</div>' +
          '<div class="input-group">' +
            '<div class="input-label">Nomor HP <span class="input-required">*</span></div>' +
            '<input class="input" id="inp-hp" type="tel" placeholder="contoh: 08123456789" autocomplete="tel">' +
          '</div>' +
          '<div class="input-group">' +
            '<div class="input-label">Kota</div>' +
            '<input class="input" id="inp-kota" type="text" placeholder="contoh: Jakarta Selatan" autocomplete="address-level2">' +
          '</div>' +
          '<div class="input-group">' +
            '<div class="input-label">Catatan</div>' +
            '<textarea class="textarea" id="inp-catatan" placeholder="Ada pertanyaan atau pesan khusus?"></textarea>' +
          '</div>' +
          '<button class="btn-submit" id="btn-lead" onclick="submitLead()">Kirim</button>' +
        '</div>';
    }

    if (BROSUR.ada_voucher) {
      var voucherSection =
        '<div class="section-cta-title">Tertarik?</div>' +
        '<div class="section-cta-sub">Dapatkan kode voucher spesial untukmu.</div>' +
        '<div class="voucher-wrap">' +
          '<button class="btn-voucher" id="btn-voucher" onclick="revealVoucher()">Lihat kode voucher</button>' +
        '</div>';

      // Jika ada lead juga, tambahkan voucher setelah lead form
      if (BROSUR.ada_lead) {
        ctaHtml += '<div style="height:24px"></div>' + voucherSection;
      } else {
        ctaHtml = voucherSection;
      }
    }

    // Jika tidak ada lead dan tidak ada voucher
    if (!BROSUR.ada_lead && !BROSUR.ada_voucher) {
      ctaHtml =
        '<div class="section-cta-title">Informasi</div>' +
        '<div class="section-cta-sub">Untuk info lebih lanjut, hubungi langsung ' +
          esc(BROSUR.advertiser) + '.</div>';
    }

    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div>' +
          '<div class="brand">SeBrosur</div>' +
        '</div>' +
      '</div>' +

      '<div class="brosur-header">' +
        '<span class="brosur-kategori">' + esc(BROSUR.kategori) + '</span>' +
        '<div class="brosur-nama">' + esc(BROSUR.nama) + '</div>' +
        '<div class="brosur-advertiser">oleh <strong>' + esc(BROSUR.advertiser) + '</strong></div>' +
      '</div>' +

      '<div class="brosur-desc">' + esc(BROSUR.deskripsi) + '</div>' +

      '<div class="divider"></div>' +

      '<div class="section-cta">' + ctaHtml + '</div>' +

      '<div class="page-footer">Brosur ini disampaikan oleh mitra SeBrosur</div>';
  }

  // =============================================
  // SUBMIT LEAD
  // =============================================
  function submitLead() {
    var nama = document.getElementById('inp-nama').value.trim();
    var hp   = document.getElementById('inp-hp').value.trim();
    var kota = document.getElementById('inp-kota').value.trim();
    var cat  = document.getElementById('inp-catatan').value.trim();

    // Validation
    if (!nama || !hp) {
      showFormError('Nama lengkap dan nomor HP wajib diisi.');
      return;
    }

    var btn = document.getElementById('btn-lead');
    var err = document.getElementById('form-error');
    btn.textContent = 'Mengirim...';
    btn.disabled    = true;
    if (err) err.classList.remove('show');

    fetchPost({
      action: 'submitLead',
      ref:    REF_CODE,
      nama:   nama,
      hp:     hp,
      kota:   kota,
      catatan: cat
    })
    .then(function(data) {
      if (data.error) {
        showFormError(data.error);
        btn.textContent = 'Kirim';
        btn.disabled    = false;
        return;
      }
      showLeadSuccess();
    })
    .catch(function() {
      showFormError('Gagal mengirim. Coba lagi.');
      btn.textContent = 'Kirim';
      btn.disabled    = false;
    });
  }

  function showFormError(msg) {
    var el = document.getElementById('form-error');
    if (el) { el.textContent = msg; el.classList.add('show'); }
  }

  function showLeadSuccess() {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div><div class="brand">SeBrosur</div></div>' +
      '</div>' +
      '<div class="state-screen">' +
        '<div class="state-icon">🎉</div>' +
        '<div class="state-title">Terima kasih!</div>' +
        '<div class="state-sub">' +
          'Data kamu sudah kami terima.<br>' +
          'Tim kami akan menghubungi kamu segera.' +
        '</div>' +
      '</div>' +
      '<div class="page-footer">Brosur ini disampaikan oleh mitra SeBrosur</div>';
  }

  // =============================================
  // VOUCHER
  // =============================================
  function revealVoucher() {
    var btn = document.getElementById('btn-voucher');
    if (!btn) return;
    btn.textContent = 'Memuat...';
    btn.disabled    = true;

    fetchPost({ action: 'getVoucher', ref: REF_CODE })
      .then(function(data) {
        if (data.error) {
          showToast('Gagal: ' + data.error);
          btn.textContent = 'Lihat kode voucher';
          btn.disabled    = false;
          return;
        }
        var wrap = btn.parentElement;
        wrap.innerHTML =
          '<div class="voucher-box">' +
            '<div class="voucher-label">Kode voucher kamu</div>' +
            '<div class="voucher-code">' + esc(data.kode) + '</div>' +
          '</div>' +
          '<div class="voucher-instruksi">' +
            '<strong>Cara pakai:</strong><br>' +
            esc(data.instruksi || 'Tunjukkan kode ini saat melakukan transaksi.') +
          '</div>';
      })
      .catch(function() {
        showToast('Gagal memuat voucher. Coba lagi.');
        btn.textContent = 'Lihat kode voucher';
        btn.disabled    = false;
      });
  }

  // =============================================
  // STATE SCREENS
  // =============================================
  function showSuspendedScreen() {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div><div class="brand">SeBrosur</div></div>' +
      '</div>' +
      '<div class="state-screen">' +
        '<div class="state-icon">⏸️</div>' +
        '<div class="state-title">Penawaran tidak tersedia</div>' +
        '<div class="state-sub">Penawaran ini sedang tidak tersedia saat ini.<br>Silakan coba lagi nanti.</div>' +
      '</div>';
  }

  function showErrorScreen(msg) {
    document.getElementById('app').innerHTML =
      '<div class="topbar">' +
        '<div><div class="brand">SeBrosur</div></div>' +
      '</div>' +
      '<div class="state-screen">' +
        '<div class="state-icon">🚫</div>' +
        '<div class="state-title">Tidak dapat diakses</div>' +
        '<div class="state-sub">' + esc(msg) + '</div>' +
      '</div>';
  }

  // =============================================
  // UTILS
  // =============================================
  function fetchPost(data) {
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(data),
      headers: { 'Content-Type': 'text/plain' }
    }).then(function(r) { return r.json(); });
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 3500);
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // SERVICE WORKER
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sebrosur/serviceworker.js')
        .then(function(r) { console.log('SW brosur:', r.scope); })
        .catch(function(e) { console.log('SW error:', e); });
    });
  }
</script>
</body>
</html>
